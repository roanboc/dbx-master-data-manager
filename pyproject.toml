[project]
name = "master-data-manager"
version = "0.2.0"
description = "Master Data Manager: explainable matching and golden records on DuckDB and Lakebase"
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.5,<2",
    "pytz>=2024.1",                 # DuckDB needs it to return TIMESTAMPTZ values
    "psycopg[binary,pool]>=3.3,<4",
    "rapidfuzz>=3.14,<4",
    "jellyfish>=1.2,<2",
    "pyyaml>=6.0",
    "typer>=0.27",
    # The steward workbench (`mdm ui`). Mantine and AG Grid bundle their styles and themes, so the
    # workbench loads nothing from a network at run time.
    "dash>=4.4,<5",
    "dash-mantine-components>=2.8,<3",
    "dash-ag-grid>=35.3,<36",
]

[project.optional-dependencies]
# What the platform needs: Lakebase credentials and, when enabled, a serving endpoint.
# Imported lazily, only in backend/lakebase_auth.py and agent/provider.py.
databricks = ["databricks-sdk>=0.143"]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-xdist>=3.8",
    "ruff>=0.16",
]
# The browser checks, installed with `uv sync --group gui` (make test-gui; CI's browser job).
# Pinned: the driver and its Chromium build ship as a pair (build 1194 for 1.56).
gui = ["playwright>=1.56,<1.57", "axe-playwright-python>=0.1.8"]

[project.scripts]
mdm = "mdm.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mdm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q -m 'not live and not gui'"
markers = [
  "postgres: runs on the Postgres engine",
  "live: runs against a Lakebase endpoint (MDM_LIVE_LAKEBASE=1)",
  "slow: over five seconds; runs in CI, skipped by make test-fast",
  "gui: drives the workbench in a browser (make test-gui)",
]
# a thread that raises inside a test fails the test, never passes with a warning
filterwarnings = [
  "error::pytest.PytestUnhandledThreadExceptionWarning",
  "ignore::DeprecationWarning",
]

[tool.ruff]
# scripts/ holds archreator's validators as the scaffold ships them, so they can be refreshed from upstream
# (check_links.py adds `.venv` to the folders it skips; keep that line on a refresh).
extend-exclude = ["scripts", ".agents"]
line-length = 110
target-version = "py311"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/mdm/cli.py" = ["B008"]
